<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kids Town mock · 家長蓋章</title>
  <link rel="stylesheet" href="mock.css">
</head>
<body>
  <div class="desk">
    <p class="desk-caption">靜態 mock · 家長審核 · <a href="00-index.html">返回圖庫</a> · 未接線</p>
    <div class="device" aria-label="手機畫面框 390×844">
      <div class="device-speaker"></div>
      <div class="app-shell">
        <div class="status-bar"><span>9:41</span><span>家長模式</span></div>
        <header class="app-header">
          <svg class="mascot is-wait" viewBox="0 0 64 64" aria-hidden="true">
            <ellipse cx="18" cy="16" rx="9" ry="13" fill="#c4b5fd" transform="rotate(-20 18 16)"/>
            <ellipse cx="46" cy="16" rx="9" ry="13" fill="#c4b5fd" transform="rotate(20 46 16)"/>
            <circle cx="32" cy="34" r="22" fill="#e9d5ff"/>
            <circle cx="24" cy="31" r="3" fill="#3d2a3a"/>
            <circle cx="40" cy="31" r="3" fill="#3d2a3a"/>
            <path d="M26 42 Q32 47 38 42" fill="none" stroke="#3d2a3a" stroke-width="2.1" stroke-linecap="round"/>
            <ellipse cx="18" cy="37" rx="4" ry="2.2" fill="#ffb4c8"/>
            <ellipse cx="46" cy="37" rx="4" ry="2.2" fill="#ffb4c8"/>
          </svg>
          <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="8" width="18" height="16" rx="4" fill="#fb7185" stroke="#9f1239" stroke-width="2"/>
            <circle cx="13" cy="16" r="4" fill="#fff"/>
            <path d="M22 6h6v6" fill="none" stroke="#ffb703" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div class="header-copy">
            <h1>家長蓋章站</h1>
            <p class="sub">小朋友做完啦，等你蓋個讚賞章</p>
          </div>
        </header>

        <main class="page">
          <div class="demo-toggle" role="radiogroup" aria-label="畫面示範">
            <label><input type="radio" name="demo" value="pending" checked> <span>有待批</span></label>
            <label><input type="radio" name="demo" value="empty"> <span>全部批完</span></label>
          </div>

          <div class="pending-list">
            <p class="section-label"><span class="dot" style="background:var(--color-pending)"></span>今日待確認 · 2 件</p>

            <article class="task-card is-pending">
              <div class="task-icon" style="background:#fff3c4" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <ellipse cx="16" cy="20" rx="10" ry="7" fill="#7dd3fc" stroke="#0284c7" stroke-width="2"/>
                  <path d="M8 18c2-6 14-6 16 0" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
                </svg>
              </div>
              <div class="task-body">
                <h2>洗碗</h2>
                <div class="task-meta">
                  <span class="badge badge-pending">待家長確認</span>
                  <span class="pill pill-kid">
                    <svg class="avatar" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#ffd6a5"/><circle cx="12" cy="14" r="2"/><circle cx="20" cy="14" r="2"/><path d="M12 20q4 3 8 0" fill="none" stroke="#3d2a3a" stroke-width="1.6"/></svg>
                    小明
                  </span>
                  <span class="pill pill-gold">金幣 +15</span>
                </div>
              </div>
              <p class="mascot-row" style="grid-column:1/-1">小城仔把印章遞過來：「蓋一下就入帳啦！」</p>
              <div class="actions">
                <button class="btn btn-success" type="button">
                  <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="14" height="12" rx="3" fill="#fff" opacity=".35"/><path d="M7 13l3 3 7-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
                  蓋章入帳
                </button>
                <details class="reason-panel">
                  <summary class="btn btn-ghost">再試一次</summary>
                  <div class="reason-box">
                    <p class="mock-note" style="text-align:left;margin-bottom:8px">拒絕並寫原因 · 給小朋友看的溫柔回饋</p>
                    <div class="chips">
                      <button class="chip is-on" type="button">未完成</button>
                      <button class="chip" type="button">要再整潔啲</button>
                      <button class="chip" type="button">其他</button>
                    </div>
                    <label class="mock-note" for="reason-1" style="display:block;text-align:left">想講俾小朋友聽</label>
                    <textarea id="reason-1" placeholder="洗碗槽仲有一隻碗哦～再試一次？">洗碗槽仲有一隻碗哦～再試一次？</textarea>
                    <button class="btn btn-danger btn-block" type="button">送出再試一次</button>
                  </div>
                </details>
              </div>
            </article>

            <article class="task-card is-pending">
              <div class="task-icon" style="background:#efe7ff" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <rect x="6" y="10" width="20" height="14" rx="3" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
                  <path d="M6 14h20" stroke="#c4b5fd" stroke-width="6"/>
                  <circle cx="16" cy="8" r="4" fill="#ff8fab"/>
                </svg>
              </div>
              <div class="task-body">
                <h2>摺衣服</h2>
                <div class="task-meta">
                  <span class="badge badge-pending">待家長確認</span>
                  <span class="pill pill-kid">
                    <svg class="avatar" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#c4b5fd"/><circle cx="12" cy="14" r="2"/><circle cx="20" cy="14" r="2"/><path d="M12 20q4 4 8 0" fill="none" stroke="#3d2a3a" stroke-width="1.6"/></svg>
                    小華
                  </span>
                  <span class="pill pill-gold">金幣 +10</span>
                </div>
              </div>
              <div class="actions">
                <button class="btn btn-success" type="button">蓋章入帳</button>
                <details class="reason-panel">
                  <summary class="btn btn-ghost">再試一次</summary>
                  <div class="reason-box">
                    <div class="chips">
                      <button class="chip" type="button">未完成</button>
                      <button class="chip is-on" type="button">要再整潔啲</button>
                      <button class="chip" type="button">其他</button>
                    </div>
                    <textarea placeholder="想講俾小朋友聽"></textarea>
                    <button class="btn btn-danger btn-block" type="button">送出再試一次</button>
                  </div>
                </details>
              </div>
            </article>
          </div>

          <div class="empty-state">
            <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true" style="width:88px;height:88px">
              <ellipse cx="18" cy="20" rx="9" ry="13" fill="#a5b4fc" transform="rotate(-18 18 20)"/>
              <ellipse cx="46" cy="20" rx="9" ry="13" fill="#a5b4fc" transform="rotate(18 46 20)"/>
              <circle cx="32" cy="38" r="22" fill="#c7d2fe"/>
              <path d="M22 36 Q24 33 26 36" fill="none" stroke="#3d2a3a" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M38 36 Q40 33 42 36" fill="none" stroke="#3d2a3a" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M26 46 Q32 49 38 46" fill="none" stroke="#3d2a3a" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 18 q6 -8 0 -2" fill="none" stroke="#c4b5fd" stroke-width="2"/>
              <path d="M56 16 q-6 -8 0 -2" fill="none" stroke="#c4b5fd" stroke-width="2"/>
            </svg>
            <h2>全部蓋好章喇！</h2>
            <p>而家無待批家課。小朋友完成任務之後，會出現在這裡等你蓋章入帳。去飲杯茶先～</p>
          </div>
        </main>

        <nav class="nav" aria-label="家長分頁" style="grid-auto-columns:1fr;grid-template-columns:repeat(4,1fr)">
          <a href="#pending" class="is-active">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect x="6" y="10" width="16" height="14" rx="4" fill="#fb7185" stroke="#9f1239" stroke-width="2"/>
              <circle cx="14" cy="17" r="4" fill="#fff"/>
              <path d="M20 8h6v6" fill="none" stroke="#ffb703" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            待蓋章
          </a>
          <a href="01-kid-tasks-mobile.html">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="11" cy="12" r="5" fill="#ffd6a5" stroke="#b45309" stroke-width="2"/>
              <circle cx="21" cy="14" r="4" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>
              <path d="M4 27c1-6 12-6 14 0" fill="#ffe3ec"/>
            </svg>
            小朋友
          </a>
          <a href="00-index.html">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect x="6" y="6" width="20" height="20" rx="5" fill="#fff3c4" stroke="#e09a00" stroke-width="2"/>
              <path d="M10 14h12M10 19h8" stroke="#e09a00" stroke-width="2" stroke-linecap="round"/>
            </svg>
            帳本
          </a>
          <a href="00-index.html">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="6" fill="#e9d5ff" stroke="#6d28d9" stroke-width="2"/>
              <path d="M16 4v4M16 24v4M4 16h4M24 16h4M7 7l3 3M22 22l3 3M7 25l3-3M22 10l3-3" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
            </svg>
            設定
          </a>
        </nav>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("empty") === "1") {
      document.body.classList.add("show-empty");
      const emptyRadio = document.querySelector('input[name="demo"][value="empty"]');
      if (emptyRadio) emptyRadio.checked = true;
    }
    if (params.get("reject") === "1") {
      const panel = document.querySelector("details.reason-panel");
      if (panel) panel.open = true;
    }
    const radios = document.querySelectorAll('input[name="demo"]');
    radios.forEach((r) => {
      r.addEventListener("change", () => {
        document.body.classList.toggle("show-empty", r.value === "empty" && r.checked);
      });
    });
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        chip.parentElement.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-on"));
        chip.classList.add("is-on");
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>榮譽儀式 · Kids Town 方向稿</title>
  <link rel="stylesheet" href="mock.css">
</head>
<body class="page-honour">
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="topbar">
    <a class="brand" href="00-index.html">Kids Town 方向稿</a>
    <p class="who">家長視角</p>
  </header>
  <main id="main" class="app" tabindex="-1">
    <section class="ceremony">
      <div class="plaque">
        <p>家長蓋章</p>
        <h1>榮譽儀式</h1>
      </div>
      <svg class="medal" viewBox="0 0 120 156" aria-hidden="true">
        <path d="M38 4 L60 52 L22 4 Z" fill="#1e3a78"/>
        <path d="M82 4 L60 52 L98 4 Z" fill="#a33b32"/>
        <circle cx="60" cy="96" r="40" fill="#e2b045" stroke="#8a6410" stroke-width="4"/>
        <circle cx="60" cy="96" r="30" fill="none" stroke="#fff6d0" stroke-width="2"/>
        <path d="M60 76 L65 90 H80 L68 98 L73 112 L60 103 L47 112 L52 98 L40 90 H55 Z" fill="#fff6d0"/>
      </svg>
      <article class="certificate" id="certificate">
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
        <p class="cert-kicker">公會榮譽</p>
        <h2>榮譽證書</h2>
        <p class="cert-lead">茲證明</p>
        <p class="cert-name">小森</p>
        <p>完成每日任務</p>
        <p class="cert-task">「晨讀十五分鐘」</p>
        <p class="reward"><span class="chip">金幣 20</span><span class="chip">經驗 +8</span></p>
        <div class="seal" id="seal" aria-hidden="true">
          <span class="seal-wait">待蓋章</span>
          <span class="seal-done">核准<br>已頒獎</span>
        </div>
        <p class="cert-status" id="cert-status" aria-live="polite">尚未蓋章。按下面的金色按鈕頒發榮譽。</p>
      </article>
      <button class="btn btn-gold btn-stamp" type="button" id="stamp" aria-pressed="false">家長蓋章核准</button>
      <section class="retry" aria-labelledby="retry-title">
        <h2 id="retry-title">請再試一次</h2>
        <p class="fine">未準備好就揀原因，唔會蓋章。</p>
        <div class="retry-list" role="group" aria-label="再試原因">
          <button type="button" data-reason="還沒做完" aria-pressed="false">還沒做完</button>
          <button type="button" data-reason="需要再讀一遍" aria-pressed="false">需要再讀一遍</button>
          <button type="button" data-reason="今日先休息，明天再來" aria-pressed="false">今日先休息，明天再來</button>
        </div>
      </section>
    </section>
  </main>
  <footer class="tabbar">
    <nav aria-label="方向稿">
      <a class="tab" href="00-index.html">目錄</a>
      <a class="tab" href="01-guild-quest-board.html">任務板</a>
      <a class="tab" href="02-wilderness-adventure.html">荒野</a>
      <a class="tab" href="03-honour-reward.html" aria-current="page">榮譽</a>
    </nav>
  </footer>
  <script>
    (function () {
      var cert = document.getElementById("certificate");
      var stamp = document.getElementById("stamp");
      var status = document.getElementById("cert-status");
      var reasons = Array.prototype.slice.call(document.querySelectorAll("[data-reason]"));

      function clearReasons() {
        reasons.forEach(function (btn) { btn.setAttribute("aria-pressed", "false"); });
      }

      function setStamped(on) {
        cert.classList.toggle("is-stamped", on);
        cert.classList.remove("is-retry");
        stamp.setAttribute("aria-pressed", on ? "true" : "false");
        stamp.textContent = on ? "已蓋章核准" : "家長蓋章核准";
        status.textContent = on
          ? "已頒獎。金色榮譽章已蓋上，金幣同經驗可以入帳。"
          : "尚未蓋章。按下面的金色按鈕頒發榮譽。";
      }

      stamp.addEventListener("click", function () {
        clearReasons();
        setStamped(true);
      });

      reasons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var reason = btn.getAttribute("data-reason");
          reasons.forEach(function (item) {
            item.setAttribute("aria-pressed", item === btn ? "true" : "false");
          });
          cert.classList.remove("is-stamped");
          cert.classList.add("is-retry");
          stamp.setAttribute("aria-pressed", "false");
          stamp.textContent = "家長蓋章核准";
          status.textContent = "已記下：「" + reason + "」。請再試一次，尚未頒獎。";
        });
      });
    }());
  </script>
</body>
</html>

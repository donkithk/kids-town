<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荒野探險 · Kids Town 方向稿</title>
  <link rel="stylesheet" href="mock.css">
</head>
<body class="page-wild">
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="topbar">
    <a class="brand" href="00-index.html">Kids Town 方向稿</a>
    <p class="who">小森 · 4 等</p>
  </header>
  <main id="main" class="shell has-aside" tabindex="-1">
    <section class="stage">
      <div class="plaque">
        <p>戶外日光</p>
        <h1>荒野探險</h1>
      </div>
      <ul class="hud">
        <li><span>金幣</span><strong>128</strong></li>
        <li><span>等級</span><strong>4</strong></li>
        <li><span>生命</span><strong class="hearts">♥♥♥</strong></li>
      </ul>
      <div class="meadow" id="meadow">
        <span class="flower one" aria-hidden="true"></span>
        <span class="flower rose two" aria-hidden="true"></span>
        <span class="flower three" aria-hidden="true"></span>
        <span class="flower rose four" aria-hidden="true"></span>
        <div class="actor kid" data-actor="explore" aria-hidden="true">
          <div class="head"></div>
          <div class="body"></div>
        </div>
        <div class="actor slime" data-actor="combat" hidden aria-hidden="true">
          <i></i><i></i>
        </div>
        <div class="seg" role="group" aria-label="荒野模式">
          <button type="button" data-mode="explore" aria-pressed="true">探索</button>
          <button type="button" data-mode="combat" aria-pressed="false">戰鬥</button>
        </div>
      </div>

      <section class="panel" data-panel="explore" aria-labelledby="explore-title">
        <p class="kicker">而家身處</p>
        <p class="place" id="place">公會門外的草地</p>
        <button class="btn btn-gold" type="button" id="advance">向前走</button>
        <div class="tracker">
          <h2 id="explore-title">今日目標</h2>
          <p id="progress">已完成 1 / 3</p>
          <div class="quests">
            <button class="quest" type="button" aria-pressed="true">
              <span class="box" aria-hidden="true"></span>
              <span>走出公會大門</span>
            </button>
            <button class="quest" type="button" aria-pressed="false">
              <span class="box" aria-hidden="true"></span>
              <span>在草地找三朵野花</span>
            </button>
            <button class="quest" type="button" aria-pressed="false">
              <span class="box" aria-hidden="true"></span>
              <span>看看草地史萊姆</span>
            </button>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="combat" hidden aria-labelledby="combat-title">
        <h2 id="combat-title">草地史萊姆</h2>
        <p class="reward">明亮草地上的一場短戰鬥。這裡是方向稿，還沒有接入正式戰鬥。</p>
        <div class="hp">
          <p id="hp-label">史萊姆生命 3 / 3</p>
          <div class="hp-track" aria-hidden="true"><span class="hp-fill" id="hp-fill"></span></div>
        </div>
        <p class="victory" id="victory" hidden>勝利。可以回到草地上。</p>
        <button class="btn btn-gold" type="button" id="attack">攻擊</button>
        <button class="btn btn-quiet" type="button" id="back-explore">回到探索</button>
      </section>
    </section>
    <figure class="hero">
      <img src="../../docs/ui-direction/02-wilderness-adventure.png" width="1280" height="720" alt="已鎖定的日光荒野概念圖：藍天、草地、遠山，以及戶外任務與戰鬥介面。">
      <figcaption>已鎖定概念 · 日光荒野</figcaption>
    </figure>
  </main>
  <footer class="tabbar">
    <nav aria-label="方向稿">
      <a class="tab" href="00-index.html">目錄</a>
      <a class="tab" href="01-guild-quest-board.html">任務板</a>
      <a class="tab" href="02-wilderness-adventure.html" aria-current="page">荒野</a>
      <a class="tab" href="03-honour-reward.html">榮譽</a>
    </nav>
  </footer>
  <script>
    (function () {
      var modes = Array.prototype.slice.call(document.querySelectorAll("[data-mode]"));
      var panels = Array.prototype.slice.call(document.querySelectorAll("[data-panel]"));
      var actors = Array.prototype.slice.call(document.querySelectorAll("[data-actor]"));
      var quests = Array.prototype.slice.call(document.querySelectorAll(".quest"));
      var progress = document.getElementById("progress");
      var place = document.getElementById("place");
      var places = ["公會門外的草地", "小木橋", "向陽花田"];
      var step = 0;
      var hp = 3;
      var hpLabel = document.getElementById("hp-label");
      var hpFill = document.getElementById("hp-fill");
      var victory = document.getElementById("victory");
      var attack = document.getElementById("attack");

      function showMode(mode) {
        modes.forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-mode") === mode ? "true" : "false");
        });
        panels.forEach(function (panel) {
          panel.hidden = panel.getAttribute("data-panel") !== mode;
        });
        actors.forEach(function (actor) {
          actor.hidden = actor.getAttribute("data-actor") !== mode;
        });
      }

      function refreshProgress() {
        var done = quests.filter(function (q) { return q.getAttribute("aria-pressed") === "true"; }).length;
        progress.textContent = "已完成 " + done + " / " + quests.length;
      }

      modes.forEach(function (btn) {
        btn.addEventListener("click", function () {
          showMode(btn.getAttribute("data-mode"));
        });
      });

      quests.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var on = btn.getAttribute("aria-pressed") === "true";
          btn.setAttribute("aria-pressed", on ? "false" : "true");
          refreshProgress();
        });
      });

      document.getElementById("advance").addEventListener("click", function () {
        step = (step + 1) % places.length;
        place.textContent = places[step];
      });

      attack.addEventListener("click", function () {
        if (hp <= 0) return;
        hp -= 1;
        hpFill.style.transform = "scaleX(" + (hp / 3) + ")";
        hpLabel.textContent = hp === 0 ? "史萊姆生命 0 / 3" : "史萊姆生命 " + hp + " / 3";
        if (hp === 0) {
          victory.hidden = false;
          attack.disabled = true;
        }
      });

      document.getElementById("back-explore").addEventListener("click", function () {
        showMode("explore");
      });

      refreshProgress();
    }());
  </script>
</body>
</html>

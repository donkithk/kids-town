        <path fill="url(#midHill)" d="M0 268 C70 214 110 246 170 210 C230 176 260 230 320 204 C355 186 370 220 390 206 L390 480 L0 480 Z"/>
        <path fill="url(#nearGrass)" d="M0 330 C80 292 130 324 200 300 C270 276 310 318 390 292 L390 480 L0 480 Z"/>
        <path d="M0 400 C90 372 160 410 240 384 C300 366 340 390 390 376 L390 480 L0 480 Z" fill="#3d9434"/>
        <g transform="translate(28,236)">
          <polygon points="6,36 40,8 74,36" fill="#8c3d32"/>
          <rect x="16" y="34" width="48" height="34" rx="2" fill="#f4e4c8" stroke="#6b4224" stroke-width="2"/>
          <rect x="34" y="46" width="12" height="22" fill="#6b4224"/>

        <g transform="translate(18,188)">
          <rect x="18" y="46" width="8" height="28" rx="2" fill="#6b4224"/>
          <circle cx="22" cy="36" r="22" fill="#2f7a32"/>
          <circle cx="8" cy="44" r="14" fill="#3d9140"/>

          <rect x="16" y="40" width="8" height="26" rx="2" fill="#6b4224"/>

        <path d="M198 470 C170 410 236 372 206 328 C172 280 248 258 228 214 C210 176 168 168 184 132" fill="none" stroke="#e7d2a4" stroke-width="30" stroke-linecap="round"/>
        <path d="M198 470 C170 410 236 372 206 328 C172 280 248 258 228 214 C210 176 168 168 184 132" fill="none" stroke="#f3e2c0" stroke-width="12" stroke-linecap="round"/>
        <g transform="translate(214,248)" stroke="#6b4224" fill="none" stroke-linecap="round">
          <path d="M0 16 Q28 0 56 16" stroke-width="7"/>

        </g>
        <g fill="#f2d36a">

          <circle cx="324" cy="340" r="4"/>
        </g>
        <g fill="#e07a92">
          <circle cx="92" cy="372" r="4"/>
          <circle cx="306" cy="372" r="5"/>

        <g fill="#c89be0">
          <circle cx="124" cy="352" r="4"/>
          <circle cx="274" cy="368" r="4"/>

      </svg>
      <div class="hud-panel">
        <h1>荒野探險</h1>
        <div class="hud-row">
          <span>4 等</span>
          <span>金幣 <strong id="coins">128</strong></span>
        </div>
        <div class="bar-row">
          <span id="hp-label">生命</span>
          <span class="track" role="meter" aria-labelledby="hp-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hp-meter"><span class="fill fill-hp" id="hp-fill"></span></span>
          <span id="hp-num">100</span>
        </div>
        <div class="bar-row">
          <span id="sta-label">體力</span>
          <span class="track" role="meter" aria-labelledby="sta-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="sta-meter"><span class="fill fill-sta" id="sta-fill"></span></span>
          <span id="sta-num">100</span>
        </div>
        <p class="place-line" id="place">而家：公會門外的草地</p>
      </div>
      <div class="kid" id="kid" data-step="0" aria-hidden="true">
        <div class="kid-head"></div>
        <div class="kid-body"></div>
      </div>
      <div class="slime" id="slime" hidden aria-hidden="true">
        <i></i><i></i><span class="shine"></span>
      </div>
      <section class="tracker" aria-labelledby="track-title">
        <h2 id="track-title">任務追蹤</h2>
        <ol class="track-list">
          <li data-quest="gate" class="is-done"><span class="mark" aria-hidden="true"></span>走出公會大門<span class="done-label">，已完成</span></li>
          <li data-quest="bridge"><span class="mark" aria-hidden="true"></span>行過木橋<span class="done-label">，已完成</span></li>
          <li data-quest="field"><span class="mark" aria-hidden="true"></span>穿過花田<span class="done-label">，已完成</span></li>
          <li data-quest="slime"><span class="mark" aria-hidden="true"></span>打贏草地史萊姆<span class="done-label">，已完成</span></li>
        </ol>
        <div class="enemy" id="enemy" hidden>
          <p id="enemy-label">草地史萊姆</p>
          <div class="bar-row">
            <span>生命</span>
            <span class="track" role="meter" aria-labelledby="enemy-label" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3" id="enemy-meter"><span class="fill fill-enemy" id="enemy-fill" style="width:100%"></span></span>
            <span id="enemy-num">3</span>
          </div>
        </div>
        <p class="victory" id="victory" hidden>勝利 · 金幣 +15</p>
      </section>
    </section>
    <div class="dock">
      <p class="status-live" id="wild-live" aria-live="polite">沿住小路向前探索。遇到史萊姆就可以攻擊。</p>
      <div class="dock-actions">
        <button class="btn btn-gold" type="button" id="explore">向前探索</button>
        <button class="btn btn-attack" type="button" id="attack" disabled>攻擊</button>
      </div>
    </div>
  </main>
  <footer class="tabbar">
    <nav aria-label="方向稿">
      <a class="tab" href="00-index.html">目錄</a>
      <a class="tab" href="01-guild-quest-board.html">任務板</a>
      <a class="tab" href="02-wilderness-adventure.html" aria-current="page">荒野</a>
      <a class="tab" href="03-honour-reward.html">榮譽</a>
    </nav>
  </footer>
  <script>
    (function () {
      var places = ["公會門外的草地", "小木橋", "向陽花田", "史萊姆草地"];
      var step = 0;
      var reached = 0;
      var hp = 100;
      var stamina = 100;
      var slimeHp = 3;
      var coins = 128;
      var rewarded = false;
      var kid = document.getElementById("kid");
      var slime = document.getElementById("slime");
      var place = document.getElementById("place");
      var live = document.getElementById("wild-live");
      var attack = document.getElementById("attack");
      var enemy = document.getElementById("enemy");
      var victory = document.getElementById("victory");
      var hpFill = document.getElementById("hp-fill");
      var staFill = document.getElementById("sta-fill");
      var enemyFill = document.getElementById("enemy-fill");
      var hpNum = document.getElementById("hp-num");
      var staNum = document.getElementById("sta-num");
      var enemyNum = document.getElementById("enemy-num");
      var hpMeter = document.getElementById("hp-meter");
      var staMeter = document.getElementById("sta-meter");
      var enemyMeter = document.getElementById("enemy-meter");
      var coinsEl = document.getElementById("coins");
      var quests = {
        gate: document.querySelector('[data-quest="gate"]'),
        bridge: document.querySelector('[data-quest="bridge"]'),
        field: document.querySelector('[data-quest="field"]'),
        slime: document.querySelector('[data-quest="slime"]')
      };

      function clamp(n) {
        return Math.max(0, Math.min(100, n));
      }

      function mark(el, on) {
        el.classList.toggle("is-done", on);
      }

      function render() {
        kid.dataset.step = String(step);
        place.textContent = "而家：" + places[step];
        var fighting = step === 3 && slimeHp > 0;
        slime.hidden = !fighting;
        enemy.hidden = !fighting;
        victory.hidden = slimeHp > 0;
        attack.disabled = !fighting;
        hp = clamp(hp);
        stamina = clamp(stamina);
        hpFill.style.width = hp + "%";
        staFill.style.width = stamina + "%";
        enemyFill.style.width = (slimeHp / 3 * 100) + "%";
        hpNum.textContent = String(hp);
        staNum.textContent = String(stamina);
        enemyNum.textContent = String(Math.max(slimeHp, 0));
        hpMeter.setAttribute("aria-valuenow", String(hp));
        staMeter.setAttribute("aria-valuenow", String(stamina));
        enemyMeter.setAttribute("aria-valuenow", String(Math.max(slimeHp, 0)));
        coinsEl.textContent = String(coins);
        mark(quests.gate, true);
        mark(quests.bridge, reached >= 1);
        mark(quests.field, reached >= 2);
        mark(quests.slime, slimeHp <= 0);
      }

      document.getElementById("explore").addEventListener("click", function () {
        step = (step + 1) % places.length;
        if (step > reached) reached = step;
        stamina -= 8;
        if (step === 3 && slimeHp > 0) {
          live.textContent = "草地史萊姆出現了！可以攻擊。";
        } else if (step === 3 && slimeHp <= 0) {
          live.textContent = "史萊姆草地已經清靜了。";
        } else if (step === 0 && reached >= 3) {
          live.textContent = "你行返公會門外的草地。";
        } else {
          live.textContent = "你行到" + places[step] + "。";
        }
        if (stamina <= 0) {
          live.textContent += " 體力好低。";
        }
        render();
      });

      attack.addEventListener("click", function () {
        if (attack.disabled || slimeHp <= 0) return;
        slimeHp -= 1;
        hp -= 6;
        stamina -= 12;
        slime.classList.remove("is-hit");
        void slime.offsetWidth;
        slime.classList.add("is-hit");
        if (slimeHp <= 0) {
          if (!rewarded) {
            coins += 15;
            rewarded = true;
          }
          live.textContent = "勝利！草地史萊姆倒地，金幣 +15。";
        } else {
          live.textContent = "你打中史萊姆。佢仲有 " + slimeHp + " 點生命。";
        }
        render();
      });

      render();
    }());
  </script>
</body>

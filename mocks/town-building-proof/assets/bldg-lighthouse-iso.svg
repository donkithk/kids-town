<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .beam { transform-box: view-box; transform-origin: 120px 48px; animation: sweep 5.6s ease-in-out infinite; }
    .flag { transform-box: fill-box; transform-origin: 0% 45%; animation: cloth 3.1s ease-in-out infinite; animation-delay: -1.2s; }
    .gull { transform-box: view-box; transform-origin: 68px 46px; animation: glide 6.6s ease-in-out infinite; animation-delay: -2.1s; }
    @keyframes sweep {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes cloth {
      0%, 100% { transform: skewX(-6deg); }
      50% { transform: skewX(7deg); }
    }
    @keyframes glide {
      0%, 100% { transform: translate(-3px, 1.2px) rotate(-4deg); }
      46% { transform: translate(9px, -3.6px) rotate(3deg); }
      74% { transform: translate(3px, -1px) rotate(1deg); }
    }
  </style>


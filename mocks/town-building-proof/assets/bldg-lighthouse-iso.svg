<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    .beam, .gull, .wing { pointer-events: none; }
    .beam { transform-box: view-box; transform-origin: 120px 42px; animation: sweep 14s linear infinite; }
    .gull { animation: fly 8s ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: 10% 80%; animation: flap 1.1s ease-in-out infinite; }
    .wing.r { animation-delay: .05s; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes fly {
      0% { transform: translate(0, 0) scaleX(1); }
      25% { transform: translate(26px, -10px) scaleX(1); }
      50% { transform: translate(10px, -18px) scaleX(-1); }
      75% { transform: translate(-18px, -6px) scaleX(-1); }
      100% { transform: translate(0, 0) scaleX(1); }
    }
    @keyframes flap {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-22deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .beam, .gull, .wing { animation: none; }
    }
  </style>
  <polygon points="120,192 170,168 120,144 70,168" fill="#e4d2a4" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>

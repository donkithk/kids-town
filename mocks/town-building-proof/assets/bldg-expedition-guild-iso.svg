  <style>
    svg, svg * { pointer-events: none; }
    .banner { transform-box: view-box; transform-origin: 168px 78px; animation: sway 3.6s ease-in-out infinite; }
    .note { transform-box: fill-box; transform-origin: 12% 18%; animation: flutter 3.3s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes flutter {
      0%, 100% { transform: skewX(-4deg); }
      50% { transform: skewX(5deg); }
    }
  </style>

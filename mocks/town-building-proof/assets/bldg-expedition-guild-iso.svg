<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .banner { transform-box: view-box; transform-origin: 162px 58px; animation: sway 3.6s ease-in-out infinite; }
    .note { transform-box: fill-box; transform-origin: 10% 15%; animation: flutter 3.3s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes flutter {
      0%, 100% { transform: skewX(-4deg); }
      50% { transform: skewX(5deg); }
    }
  </style>

  <polygon points="120,186 188,154 120,122 52,154" fill="#e4d2a4" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M74 158c8-2 14-2 18 1M156 154c8-2 12-1 16 2" stroke="#c4a06a" stroke-width="1.3" stroke-linecap="round" opacity=".5"/>

  <g>
    <path d="M186 148c1-10 2-16 0-22" stroke="#5c3d28" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M184 128c7-2 12-8 6-13-6 1-10 7-6 13z" fill="#6fa344" stroke="#5c3d28" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="190" cy="122" r="2.1" fill="#e07a3d" stroke="#5c3d28" stroke-width="1"/>
  </g>

  <!-- stone courtyard -->
  <polygon points="120,174 150,160 120,148 90,160" fill="#d5ccbc" stroke="#5c3d28" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M104 166 L120 158 L136 166 M112 162 L120 158 L128 162" stroke="#8f8678" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>

  <!-- gatehouse -->
  <polygon points="114,154 74,136 74,102 114,120" fill="#c4baa8" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="118,154 170,130 170,96 118,120" fill="#e6dfd2" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M80 128 L110 142 M80 116 L110 130 M82 108 L106 120" stroke="#8a8174" stroke-width="1.35" stroke-linecap="round" opacity=".75"/>
  <path d="M88 136 v-10 M98 140 v-12 M126 144 L164 128 M130 132 L166 116 M134 120 L164 108" stroke="#8a8174" stroke-width="1.25" stroke-linecap="round" opacity=".65"/>
  <path d="M140 140 v-10 M154 134 v-10" stroke="#a39888" stroke-width="1.15" stroke-linecap="round" opacity=".7"/>

  <!-- left tower -->
  <polygon points="80,124 52,110 52,60 80,74" fill="#b7aea0" stroke="#5c3d28" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="80,124 104,114 104,64 80,74" fill="#d9d2c4" stroke="#5c3d28" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M58 104 L76 114 M58 92 L76 102 M58 80 L76 90 M86 116 L100 110 M86 104 L100 98 M86 92 L100 86" stroke="#8a8174" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>

  <!-- right tower -->
  <polygon points="142,118 120,108 120,66 142,76" fill="#c4baa8" stroke="#5c3d28" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="142,118 174,102 174,60 142,76" fill="#efeae0" stroke="#5c3d28" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M126 104 L138 110 M126 92 L138 98 M126 80 L138 86 M150 110 L168 100 M150 98 L168 88 M150 86 L168 76" stroke="#8a8174" stroke-width="1.2" stroke-linecap="round" opacity=".65"/>

  <!-- blue-gray tower roofs, shared ridges -->
  <path d="M54,64 L80,76 L86,40 L62,34 Z" fill="#5e6e78" stroke="#5c3d28" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M106,62 L80,76 L86,40 L104,36 Z" fill="#8ea0aa" stroke="#5c3d28" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M60,60 L78,70 M66,50 L82,60" stroke="#3e4c56" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M100,56 L82,70 M96,46 L86,56" stroke="#5c6e78" stroke-width="1.3" stroke-linecap="round"/>

  <path d="M118,66 L146,76 L152,44 L128,38 Z" fill="#6d7e88" stroke="#5c3d28" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M174,58 L146,76 L152,44 L170,36 Z" fill="#a8b8c0" stroke="#5c3d28" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M124,62 L144,72 M130,52 L148,62" stroke="#3e4c56" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M168,52 L148,70 M162,44 L154,54" stroke="#6a7c86" stroke-width="1.3" stroke-linecap="round"/>

  <!-- parapet in front of the eaves -->
  <polygon points="56,66 66,70 66,60 56,56" fill="#d5ccbc" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="70,72 80,76 80,66 70,62" fill="#cfc6b6" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="84,72 94,68 94,58 84,62" fill="#e6dfd2" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="96,66 104,62 104,52 96,56" fill="#efeae0" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="124,70 134,74 134,64 124,60" fill="#d9d2c4" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="148,70 160,66 160,56 148,60" fill="#efeae0" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="162,62 172,58 172,48 162,52" fill="#f4f0e6" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- timber arch, seated on the upper step -->
  <path d="M102,150 C102,130 110,118 120,116 C130,118 138,130 138,150 L136,164 L104,164 Z" fill="#3e3830" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="116,166 104,160 104,132 116,138" fill="#5c3d28" stroke="#5c3d28" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="124,166 136,160 136,132 124,138" fill="#7a5236" stroke="#5c3d28" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="114,156 107,153 107,140 114,143" fill="#8b5e3c" stroke="#5c3d28" stroke-width="1"/>
  <polygon points="126,156 133,153 133,140 126,143" fill="#a67c52" stroke="#5c3d28" stroke-width="1"/>
  <path d="M106 146 h8 M126 146 h8" stroke="#3e342c" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="117" cy="150" r="1.7" fill="#c4a06a"/>
  <circle cx="123" cy="150" r="1.7" fill="#e7c56a"/>

  <!-- steps in front of the door -->
  <polygon points="120,178 148,164 120,154 92,164" fill="#cfc6b6" stroke="#5c3d28" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="92,164 120,154 120,160 92,170" fill="#b7aea0" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="148,164 120,154 120,160 148,170" fill="#ddd6c8" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="120,166 136,158 120,152 104,158" fill="#e6dfd2" stroke="#5c3d28" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="104,158 120,152 120,158 104,164" fill="#c4baa8" stroke="#5c3d28" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="136,158 120,152 120,158 136,164" fill="#efeae0" stroke="#5c3d28" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- outdoor quest board, left of the steps -->
  <path d="M64,176 v-36" stroke="#5c3d28" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M90,166 v-34" stroke="#5c3d28" stroke-width="3.2" stroke-linecap="round"/>
  <polygon points="52,136 98,152 98,170 52,154" fill="#6b4428" stroke="#5c3d28" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="56,140 78,148 78,162 56,154" fill="#fffaf2" stroke="#5c3d28" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M60 147 h14 M60 151 h12 M60 155 h9" stroke="#6b5344" stroke-width="1.25" stroke-linecap="round"/>
  <g class="note">
    <polygon points="70,138 96,148 94,162 68,152" fill="#f7f1e4" stroke="#5c3d28" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M76 146 h14 M76 150 h12 M76 154 h8" stroke="#8b5e3c" stroke-width="1.25" stroke-linecap="round"/>
  </g>
  <circle cx="72" cy="144" r="2.3" fill="#c45c48" stroke="#5c3d28" stroke-width="0.9"/>

  <!-- guild banner on the right tower -->
  <g class="banner">
    <path d="M162,58 v9" stroke="#5c3d28" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="160,67 184,74 182,96 158,88" fill="#c45c48" stroke="#5c3d28" stroke-width="2.1" stroke-linejoin="round"/>
    <polygon points="160,76 182,82 181,87 159,81" fill="#f3e6c8" stroke="#5c3d28" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="171" cy="82" r="4.6" fill="#e7c56a" stroke="#5c3d28" stroke-width="1.2"/>
    <path d="M171 78.2 v7.6 M167.4 82 h7.2" stroke="#5c3d28" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M171 78.2 l1.5 2.2 h-3z" fill="#c45c48"/>
  </g>
</svg>

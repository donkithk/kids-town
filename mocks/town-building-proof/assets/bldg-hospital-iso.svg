    <polygon points="90,20 98,20 98,4 90,4" fill="#e24b4b" stroke="#5c3d28" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="82,16 106,16 106,10 82,10" fill="#e24b4b" stroke="#5c3d28" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

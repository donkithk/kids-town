<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .cross { animation: glow 2.9s ease-in-out infinite; }
    .curtain { transform-box: fill-box; transform-origin: 0% 15%; animation: cloth 3.6s ease-in-out infinite; animation-delay: -1.2s; }
    .steam { transform-box: view-box; transform-origin: 78px 164px; animation: rise 3.3s ease-in-out infinite; animation-delay: -0.6s; }
    @keyframes glow {
      0%, 100% { opacity: .5; }
      50% { opacity: 1; }
    }
    @keyframes cloth {
      0%, 100% { transform: skewX(-5deg); }
      50% { transform: skewX(6deg); }
    }
    @keyframes rise {
      0%, 100% { transform: translate(0, 1px); opacity: .2; }
      50% { transform: translate(1px, -6px); opacity: .88; }
    }
  </style>
  <polygon points="120,186 188,154 120,122 52,154" fill="#f4ead4" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>

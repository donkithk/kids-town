<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .cross { transform-box: view-box; transform-origin: 122.6px 66px; animation: nod 3.6s ease-in-out infinite; }
    .lamp { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes nod {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4.5deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .25; }
      50% { opacity: 1; }
    }
  </style>


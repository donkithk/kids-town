<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .bell { transform-box: view-box; transform-origin: 149px 79px; animation: bob 3.2s ease-in-out infinite; }
    .bell-draw { transform-box: view-box; transform-origin: 0 0; }
    .glint { animation: glint 2.8s ease-in-out infinite; }
    .lamp { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translate(0, 0) rotate(-3.5deg); }
      50% { transform: translate(0, -4px) rotate(4.5deg); }
    }
    @keyframes glint {
      0%, 100% { opacity: .08; }
      50% { opacity: 1; }
    }
    @keyframes breathe {
      0%, 100% { opacity: .22; }
      50% { opacity: 1; }
    }
  </style>
  <polygon points="120,186 188,154 120,122 52,154" fill="#d9c7a0" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>

  <!-- smooth stucco box: left shade, right light. Edges share the wall slope. -->
  <polygon points="124,168 60,142 60,92 124,116" fill="#cbb89a" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="116,168 180,142 180,92 116,116" fill="#f3e6cf" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="124,168 60,142 60,132 124,156" fill="#b09a7c" stroke="#5c3d28" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="116,168 180,142 180,132 116,156" fill="#e2d0b4" stroke="#5c3d28" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="116,168 120,170 120,114 116,112" fill="#a89074" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="120,170 124,168 124,112 120,114" fill="#c4b094" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- right-face window: vertical jambs, top and bottom run with the wall -->
  <polygon points="164,118 178,112.3 178,132.3 164,138" fill="#8d7b66" stroke="#5c3d28" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="166.6,121.4 175.4,117.8 175.4,129.2 166.6,132.8" fill="#f6e27a" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <path class="lamp" d="M167.4,122.6 L174.4,119.8 L174.4,127.6 L167.4,130.4 Z" fill="#fff6c2"/>
  <path d="M171,119.6 L171,131" stroke="#5c3d28" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M166.8,127.2 L175.2,123.8" stroke="#5c3d28" stroke-width="1.35" stroke-linecap="round"/>
  <polygon points="164,138 178,132.3 180.4,135.4 166.4,141.1" fill="#d9c7ae" stroke="#5c3d28" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="164,118 166.4,119.2 166.4,139.2 164,138" fill="#a8947c" stroke="#5c3d28" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- one wide storefront leaf: a single glass opening and one crash bar -->
  <polygon points="118,139 160,122 160,150 118,167" fill="#8d7b66" stroke="#5c3d28" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="122.5,144.2 155.5,130.8 155.5,145.2 122.5,158.6" fill="#d7eef6" stroke="#5c3d28" stroke-width="1.8" stroke-linejoin="round"/>
  <path class="glint" d="M126,148 L146,139.9 L143,149 L123,157.1 Z" fill="#fffef8"/>
  <polygon points="124.5,149.6 153.5,137.9 153.5,141.8 124.5,153.5" fill="#5c646c" stroke="#3b322c" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="124.5,153.5 153.5,141.8 153.5,144.2 124.5,155.9" fill="#3a4046" stroke="#3b322c" stroke-width="1" stroke-linejoin="round"/>

  <path d="M48,98 L128,128 L124,136 L52,106 Z" fill="#6a5b4c"/>
  <path d="M192,98 L112,128 L116,136 L188,106 Z" fill="#7d6c5c"/>
  <path d="M48,98 L128,128 L120,26 L66,56 Z" fill="#8d7b68"/>
  <path d="M192,98 L112,128 L120,26 L174,56 Z" fill="#c4b09a"/>
  <path d="M48,98 L128,128 L120,26 L66,56 Z" fill="none" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M192,98 L112,128 L120,26 L174,56 Z" fill="none" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M48,98 L128,128 L124,136 L52,106 Z" fill="none" stroke="#5c3d28" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M192,98 L112,128 L116,136 L188,106 Z" fill="none" stroke="#5c3d28" stroke-width="2.2" stroke-linejoin="round"/>

  <g class="bell">
  <g class="bell-draw" transform="translate(150,79) rotate(-16) scale(1.6)">
    <path d="M-6.6,1.4 C-7.4,-7.6 -6.8,-15.2 0,-17 C6.8,-15.2 7.4,-7.6 6.6,1.4" fill="none" stroke="#2c4d66" stroke-width="7.4" stroke-linecap="round"/>
    <path d="M-6.6,1.4 C-7.4,-7.6 -6.8,-15.2 0,-17 C6.8,-15.2 7.4,-7.6 6.6,1.4" fill="none" stroke="#4e7596" stroke-width="5.3" stroke-linecap="round"/>
    <path d="M-1.6,-15.2 C1.2,-16.6 4.2,-15.6 5.2,-13.4" fill="none" stroke="#c5dced" stroke-width="1.55" stroke-linecap="round"/>
    <ellipse cx="-2.2" cy="6.6" rx="14.2" ry="13.4" fill="#3c5e78"/>
    <ellipse cx="0" cy="3.4" rx="14.2" ry="13.4" fill="#5b82a4" stroke="#2c4d66" stroke-width="1.45"/>
    <path d="M-8.6,2.2 C-4.4,-1.2 4.6,-1.2 8.8,2.2" fill="none" stroke="#c5d8e8" stroke-width="3.7" stroke-linecap="round"/>
    <ellipse cx="-6.4" cy="1.5" rx="2.3" ry="1.45" fill="#6a93af"/>
    <ellipse cx="6.8" cy="1.2" rx="2.5" ry="1.55" fill="#d7e8f4"/>
    <text x="0" y="9.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.4" font-weight="700" fill="#e8eef3">KG</text>
  </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">

  <polygon points="120,186 188,154 120,122 52,154" fill="#e4d2a4" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>

  <g class="star" fill="#f0c14b">
    <path d="M38,44 l1.7,3.6 3.8,.9 -2.9,2.5 1,3.7 -3.6,-2.1 -3.6,2.1 1,-3.7 -2.9,-2.5 3.8,-.9 z"/>
  </g>
  <g class="star b" fill="#fff6d4">
    <path d="M204,30 l1.3,2.8 3,.7 -2.3,2 0.8,2.9 -2.8,-1.6 -2.8,1.6 .8,-2.9 -2.3,-2 3,-.7 z"/>
  </g>
  <g class="star c" fill="#f6e7a8">
    <path d="M28,78 l1.2,2.5 2.7,.6 -2.1,1.8 .7,2.6 -2.5,-1.5 -2.5,1.5 .7,-2.6 -2.1,-1.8 2.7,-.6 z"/>
  </g>

  <!-- pale plaster plinth -->
  <ellipse cx="120" cy="168" rx="54" ry="18" fill="#e6e1d8" stroke="#5c3d28" stroke-width="2.6"/>
  <ellipse cx="120" cy="164" rx="48" ry="15" fill="#f7f4ee" stroke="#5c3d28" stroke-width="2.2"/>

  <!-- smooth white drum: full wall, then left shade -->
  <path d="M74,112 L74,152 A46,16 0 0 0 166,152 L166,112" fill="#f4f1ea" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M74,112 L74,152 A46,16 0 0 0 120,168 L120,128" fill="#e3dcd2"/>
  <path d="M74,140 L74,152 A46,16 0 0 0 166,152 L166,140" fill="#d9d3c8" opacity=".55"/>

  <!-- arched opening in the plaster, not a timber door -->
  <path d="M114,158 L114,140 Q114,126 130,126 Q146,126 146,140 L146,158 Z" fill="#cfc8bd" stroke="#5c3d28" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M119,156 L119,142 Q119,132 130,132 Q141,132 141,142 L141,156 Z" fill="#3e4854" stroke="#5c3d28" stroke-width="1.6"/>
  <path class="lamp" d="M122,150 Q130,142 138,150 L138,156 L122,156 Z" fill="#ffe7a3"/>

  <!-- round window -->
  <circle cx="154" cy="134" r="10" fill="#d4cdc2" stroke="#5c3d28" stroke-width="2.2"/>
  <circle cx="154" cy="134" r="6.6" fill="#f6e27a" stroke="#5c3d28" stroke-width="1.5"/>
  <circle class="lamp" cx="154" cy="134" r="4.2" fill="#fff6c2"/>
  <path d="M154,128.2 v11.6 M148.2,134 h11.6" stroke="#5c3d28" stroke-width="1.15" stroke-linecap="round"/>

  <!-- drum lip -->
  <ellipse cx="120" cy="112" rx="46" ry="16" fill="#fbf9f4" stroke="#5c3d28" stroke-width="3"/>
  <ellipse cx="120" cy="112" rx="46" ry="16" fill="none" stroke="#fff" stroke-width="2" opacity=".35"/>

  <g class="dome">
    <path d="M80,102 C82,66 98,44 120,40 C142,44 158,66 160,102 Z" fill="#7b8694" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120,40 C142,44 158,66 160,102 L120,102 Z" fill="#9aa6b4"/>
    <path d="M132,50 C146,60 154,76 156,92" fill="none" stroke="#d5dee8" stroke-width="3.2" stroke-linecap="round"/>
    <!-- shutter slit -->
    <path d="M118,48 C128,64 136,80 142,96 L132,100 C124,82 114,64 106,50 Z" fill="#2a3440" stroke="#5c3d28" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M112,54 C120,68 126,82 130,96" fill="none" stroke="#46525e" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="120" cy="102" rx="41" ry="13.5" fill="#e7e2da" stroke="#5c3d28" stroke-width="2.6"/>

    <!-- soft-metal telescope -->
    <g transform="translate(132,80) rotate(-32) scale(1.18)">
      <rect x="-8" y="-4.2" width="16" height="8.4" rx="2.2" fill="#6a7480" stroke="#5c3d28" stroke-width="1.6"/>
      <rect x="2" y="-6" width="42" height="12" rx="6" fill="#8e99a6" stroke="#5c3d28" stroke-width="2.2"/>
      <path d="M8,-4.2 H38" stroke="#e4ebf2" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="16" y="-7" width="3.4" height="14" rx="1.2" fill="#5c6773" stroke="#5c3d28" stroke-width="1.2"/>
      <rect x="32" y="-7" width="3.4" height="14" rx="1.2" fill="#5c6773" stroke="#5c3d28" stroke-width="1.2"/>
      <circle cx="50" cy="0" r="8.2" fill="#d7eaf4" stroke="#5c3d28" stroke-width="2.2"/>
      <circle cx="47.6" cy="-2" r="2.3" fill="#fff"/>
      <rect x="-4" y="-3.2" width="8" height="6.4" rx="2" fill="#6a7480" stroke="#5c3d28" stroke-width="1.4"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">

  <polygon points="120,186 188,154 120,122 52,154" fill="#e4d2a4" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>

  <g class="star" fill="#f0c14b">
    <path d="M38,44 l1.7,3.6 3.8,.9 -2.9,2.5 1,3.7 -3.6,-2.1 -3.6,2.1 1,-3.7 -2.9,-2.5 3.8,-.9 z"/>
  </g>
  <g class="star b" fill="#fff6d4">
    <path d="M204,30 l1.3,2.8 3,.7 -2.3,2 0.8,2.9 -2.8,-1.6 -2.8,1.6 .8,-2.9 -2.3,-2 3,-.7 z"/>
  </g>
  <g class="star c" fill="#f6e7a8">
    <path d="M28,78 l1.2,2.5 2.7,.6 -2.1,1.8 .7,2.6 -2.5,-1.5 -2.5,1.5 .7,-2.6 -2.1,-1.8 2.7,-.6 z"/>
  </g>

  <!-- pale plaster plinth -->
  <ellipse cx="120" cy="168" rx="54" ry="18" fill="#e6e1d8" stroke="#5c3d28" stroke-width="2.6"/>
  <ellipse cx="120" cy="164" rx="48" ry="15" fill="#f7f4ee" stroke="#5c3d28" stroke-width="2.2"/>

  <!-- smooth white drum: full wall, then left shade -->
  <path d="M74,112 L74,152 A46,16 0 0 0 166,152 L166,112" fill="#f4f1ea" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M74,112 L74,152 A46,16 0 0 0 120,168 L120,128" fill="#e3dcd2"/>
  <path d="M74,140 L74,152 A46,16 0 0 0 166,152 L166,140" fill="#d9d3c8" opacity=".55"/>

  <!-- arched door low on the drum, sill on the foundation ring -->
  <path d="M112,176 L112,158 Q112,144 130,144 Q148,144 148,158 L148,176 Z" fill="#cfc8bd" stroke="#5c3d28" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M117,174 L117,160 Q117,150 130,150 Q143,150 143,160 L143,174 Z" fill="#3e4854" stroke="#5c3d28" stroke-width="1.6"/>
  <path class="lamp" d="M120,168 Q130,160 140,168 L140,174 L120,174 Z" fill="#ffe7a3"/>
  <path d="M108,174 L152,174 L156,180 L104,180 Z" fill="#e4ddd4" stroke="#5c3d28" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- round window -->
  <circle cx="154" cy="134" r="10" fill="#d4cdc2" stroke="#5c3d28" stroke-width="2.2"/>
  <circle cx="154" cy="134" r="6.6" fill="#f6e27a" stroke="#5c3d28" stroke-width="1.5"/>
  <circle class="lamp" cx="154" cy="134" r="4.2" fill="#fff6c2"/>
  <path d="M154,128.2 v11.6 M148.2,134 h11.6" stroke="#5c3d28" stroke-width="1.15" stroke-linecap="round"/>

  <!-- thin plaster ring under the dome; the skirt covers the disc -->
  <ellipse cx="120" cy="112" rx="46" ry="14" fill="#f4f1ea" stroke="#5c3d28" stroke-width="2.4"/>

  <g class="dome">
    <!-- skirt arc comes to the front lip so the dome sits on the drum -->
    <path d="M78,108 A42,16 0 0 0 162,108 C160,70 144,44 120,40 C96,44 80,70 78,108 Z" fill="#7b8694" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120,40 C144,44 160,70 162,108 A42,16 0 0 1 120,124 Z" fill="#9aa6b4"/>
    <path d="M136,50 C150,62 158,80 160,98" fill="none" stroke="#d5dee8" stroke-width="3" stroke-linecap="round"/>
    <path d="M118,52 C128,68 136,84 140,100 L130,104 C122,86 112,68 104,54 Z" fill="#2a3440" stroke="#5c3d28" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M112,58 C120,74 126,88 130,102" fill="none" stroke="#46525e" stroke-width="1.3" stroke-linecap="round"/>

    <!-- cylindrical barrel with a flat open lens -->
    <g transform="translate(128,82) rotate(-30)">
      <rect x="-6" y="-4" width="14" height="8" rx="1.8" fill="#6a7480" stroke="#5c3d28" stroke-width="1.5"/>
      <rect x="4" y="-5.2" width="34" height="10.4" rx="1.6" fill="#8e99a6" stroke="#5c3d28" stroke-width="2.1"/>
      <path d="M10,-3.2 H32" stroke="#d5dee6" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="16" y="-6.2" width="3" height="12.4" rx="0.8" fill="#5c6773" stroke="#5c3d28" stroke-width="1.15"/>
      <rect x="30" y="-6.2" width="3" height="12.4" rx="0.8" fill="#5c6773" stroke="#5c3d28" stroke-width="1.15"/>
      <ellipse cx="42" cy="0" rx="3.4" ry="6.4" fill="#3e4852" stroke="#5c3d28" stroke-width="2"/>
      <ellipse cx="42" cy="0" rx="1.7" ry="3.6" fill="none" stroke="#9aa4ae" stroke-width="1.1"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 16 152 186" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .mill { transform-box: view-box; transform-origin: 152px 40px; animation: spin 9s linear infinite; }
    .sway-a, .sway-b { transform-box: fill-box; transform-origin: 50% 100%; }
    .sway-a { animation: breeze-a 3.2s ease-in-out infinite; }
    .sway-b { animation: breeze-b 4.1s ease-in-out infinite; animation-delay: -1.6s; }
    .hoe { transform-box: view-box; transform-origin: 137.4px 156.4px; animation: hoe 2.7s ease-in-out infinite; }
    .peck { transform-box: view-box; transform-origin: 76.96px 151.64px; animation: peck 1.45s ease-in-out infinite; }
    .duck { transform-box: view-box; transform-origin: 118.5px 169.3px; animation: waddle 2.6s ease-in-out infinite; animation-delay: -0.9s; }
    .cowhead { transform-box: view-box; transform-origin: 111px 162.4px; animation: bob 3.8s ease-in-out infinite; animation-delay: -2.2s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breeze-a {
      0%, 100% { transform: skewX(-5deg); }
      50% { transform: skewX(6deg); }
    }
    @keyframes breeze-b {
      0%, 100% { transform: skewX(4deg); }
      46% { transform: skewX(-6deg); }
    }
    @keyframes hoe {
      0%, 100% { transform: rotate(-10deg); }
      42% { transform: rotate(14deg); }
    }
    @keyframes peck {
      0%, 100% { transform: rotate(-5deg); }
      34% { transform: rotate(24deg); }
      48% { transform: rotate(16deg); }
    }
    @keyframes waddle {
      0%, 100% { transform: translate(2.2px, 0) rotate(4deg); }
      50% { transform: translate(-2.4px, 0) rotate(-4deg); }
    }
    @keyframes bob {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    .blades, .hen, .hen-head { pointer-events: none; }
    .blades { transform-box: view-box; transform-origin: 54px 64px; animation: spin 12s linear infinite; }
    .hen { animation: stroll 6s ease-in-out infinite; }
    .hen-head { transform-box: fill-box; transform-origin: 20% 60%; animation: peck 6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes stroll {
      0%, 100% { transform: translate(0, 0); }
      45% { transform: translate(12px, 2px); }
      58% { transform: translate(12px, 4px); }
      78% { transform: translate(6px, 1px); }
    }
    @keyframes peck {
      0%, 42%, 68%, 100% { transform: rotate(0deg); }
      54% { transform: rotate(26deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blades, .hen, .hen-head { animation: none; }
    }
  </style>

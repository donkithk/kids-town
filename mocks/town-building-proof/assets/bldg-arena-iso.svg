<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .flag-l, .flag-r { transform-box: fill-box; transform-origin: 0% 45%; }
    .flag-l { animation: wave 2.2s ease-in-out infinite; }
    .flag-r { animation: wave 2.6s ease-in-out infinite; transform-origin: 100% 45%; }
    .spar-a, .spar-b { transform-box: fill-box; transform-origin: 50% 92%; }
    .spar-a { animation: hopa 2.4s ease-in-out infinite; }
    .spar-b { animation: hopb 2.4s ease-in-out infinite; }
    .arm-a, .arm-b { transform-box: fill-box; }
    .arm-a { transform-origin: 22% 12%; animation: puncha 2.4s ease-in-out infinite; }
    .arm-b { transform-origin: 78% 12%; animation: punchb 2.4s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: 50% 50%; animation: pop 2.4s ease-in-out infinite; }
    @keyframes wave {
      0%, 100% { transform: rotate(-28deg); }
      50% { transform: rotate(26deg) scaleX(0.78); }
    }
    @keyframes hopa {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      38% { transform: translate(6px, -2px) rotate(-3deg); }
      52% { transform: translate(8px, -1px) rotate(3deg); }
      68% { transform: translate(3px, -1px) rotate(-1deg); }
    }
    @keyframes hopb {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      38% { transform: translate(-6px, -2px) rotate(3deg); }
      52% { transform: translate(-8px, -1px) rotate(-3deg); }
      68% { transform: translate(-3px, -1px) rotate(1deg); }
    }
    @keyframes puncha {
      0%, 100% { transform: rotate(0deg); }
      38% { transform: rotate(-36deg); }
      52% { transform: rotate(-78deg); }
    }
    @keyframes punchb {
      0%, 100% { transform: rotate(0deg); }
      38% { transform: rotate(36deg); }
      52% { transform: rotate(78deg); }
    }
    @keyframes pop {
      0%, 28%, 72%, 100% { opacity: 0; transform: scale(0.3); }
      46%, 58% { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <!-- Cell footprint. Same diamond the shared shadow sits on. -->
  <polygon points="120,190 206,150 120,110 34,150" fill="#e6c48a" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 162c16-7 26-7 40 0M128 150c14-6 22-5 34 2" stroke="#d7b27a" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <!-- Tall back half of the elliptical ring: stone arcade. -->
  <path d="M64 144L64 112A56 40 0 0 1 176 112L176 144A56 13 0 0 0 64 144Z" fill="#f4e6cc"/>
  <path d="M64 112A56 40 0 0 1 120 72L120 131A56 13 0 0 0 64 144Z" fill="#e4d0b0"/>
  <!-- Arcade openings, sitting under the curved crown and above the kids. -->
  <g fill="#4a3020" stroke="#5c3d28" stroke-width="2" stroke-linejoin="round">
    <path d="M76 98V88a5 5 0 0 1 10 0v10z"/>
    <path d="M96 96V84a6 6 0 0 1 12 0v12z"/>
    <path d="M114 94V80a6 6 0 0 1 12 0v14z"/>
    <path d="M136 96V84a6 6 0 0 1 12 0v12z"/>
    <path d="M156 98V88a5 5 0 0 1 10 0v10z"/>
  </g>
  <path d="M81 88v8M102 82v12M120 78v14M142 82v12M161 88v8" stroke="#6b4428" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
  <path d="M64 112A56 40 0 0 1 176 112" fill="none" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 144A56 13 0 0 1 176 144" fill="none" stroke="#5c3d28" stroke-width="3"/>
  <path d="M64 112v32M176 112v32" stroke="#5c3d28" stroke-width="3" stroke-linecap="round"/>
  <!-- Wooden rail along the crown. -->
  <path d="M66 110A54 38 0 0 1 174 110" fill="none" stroke="#8b5e3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 106A50 34 0 0 1 170 106" fill="none" stroke="#c4a06a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="128" r="4" fill="#a67c52" stroke="#5c3d28" stroke-width="2"/>
  <circle cx="176" cy="128" r="4" fill="#c4a06a" stroke="#5c3d28" stroke-width="2"/>

  <!-- Flags and medallion on the tall back wall, above and outside the kids. -->
  <path d="M72 100V62" stroke="#6b4428" stroke-width="3" stroke-linecap="round"/>
  <g class="flag-l">
    <polygon points="72,66 104,46 98,70 72,76" fill="#d4453a" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M80 64c10-5 18-5 26 0" stroke="#f6e0b0" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M168 100V62" stroke="#6b4428" stroke-width="3" stroke-linecap="round"/>
  <g class="flag-r">
    <polygon points="168,66 136,46 142,70 168,76" fill="#f0c14b" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M160 64c-10-5-18-5-26 0" stroke="#fff6c2" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="66" cy="120" r="5.5" fill="#f0c14b" stroke="#5c3d28" stroke-width="2"/>
  <circle cx="66" cy="120" r="2.1" fill="#fff8e7"/>
  <path d="M62.6 118h6.5" stroke="#c45c26" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Oval sand, in front of the tall wall. -->
  <ellipse cx="120" cy="158" rx="50" ry="17" fill="#f6e0b0" stroke="#c4a06a" stroke-width="2.5"/>
  <path d="M88 156h22M112 150h18M132 160h20" stroke="#e7c98a" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>

  <g class="spar-a">
    <ellipse cx="94" cy="170" rx="14" ry="4" fill="#5c3d28" opacity=".18"/>
    <path d="M86 168l-1-14M102 168l1-14" stroke="#5c3d28" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="94" cy="146" rx="16" ry="16" fill="#7eb0d4" stroke="#5c3d28" stroke-width="2"/>
    <circle cx="94" cy="122" r="12" fill="#f3c7a3" stroke="#5c3d28" stroke-width="2"/>
    <path d="M87 120q7-7 14 0" stroke="#5c3d28" stroke-width="2" fill="none"/>
    <circle cx="90" cy="120" r="1.4" fill="#5c3d28"/>
    <circle cx="98" cy="120" r="1.4" fill="#5c3d28"/>
    <g class="arm-a">
      <path d="M106 142l2 12" stroke="#f3c7a3" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="108" cy="155" r="4.2" fill="#f3c7a3" stroke="#5c3d28" stroke-width="1.6"/>
    </g>
  </g>
  <g class="spar-b">
    <ellipse cx="146" cy="170" rx="14" ry="4" fill="#5c3d28" opacity=".18"/>
    <path d="M138 168l-1-14M154 168l1-14" stroke="#5c3d28" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="146" cy="146" rx="16" ry="16" fill="#e7a3b0" stroke="#5c3d28" stroke-width="2"/>
    <circle cx="146" cy="122" r="12" fill="#f3c7a3" stroke="#5c3d28" stroke-width="2"/>
    <path d="M139 120q7-7 14 0" stroke="#5c3d28" stroke-width="2" fill="none"/>
    <circle cx="142" cy="120" r="1.4" fill="#5c3d28"/>
    <circle cx="150" cy="120" r="1.4" fill="#5c3d28"/>
    <g class="arm-b">
      <path d="M134 142l-2 12" stroke="#f3c7a3" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="132" cy="155" r="4.2" fill="#f3c7a3" stroke="#5c3d28" stroke-width="1.6"/>
    </g>
  </g>
  <g class="spark" opacity="0">
    <path d="M120 132l2.2 6 6 1.1-4.6 3.6 1.3 6-4.9-3.4-4.9 3.4 1.3-6-4.6-3.6 6-1.1z" fill="#fff6c2" stroke="#e07a3d" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- Low front half of the ring. Covers feet only. -->
  <path d="M64 164A56 16 0 0 0 176 164L168 160A48 8 0 0 1 72 160Z" fill="#f7efe0" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M74 162A46 10 0 0 0 166 162" fill="none" stroke="#8b5e3c" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 159A40 7 0 0 0 160 159" fill="none" stroke="#c4a06a" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="110,182 130,182 130,168 110,168" fill="#6b4428" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M115 172v8M120 172v8M125 172v8" stroke="#8b5e3c" stroke-width="1.2"/>
  <circle cx="120" cy="174" r="1.8" fill="#f0c14b"/>

  <g fill="#e07a3d" stroke="#5c3d28" stroke-width="1">
    <circle cx="42" cy="164" r="2.2"/>
    <circle cx="48" cy="168" r="1.6" fill="#f0c14b"/>
    <circle cx="196" cy="160" r="2"/>
    <circle cx="202" cy="156" r="1.5" fill="#d4453a"/>
  </g>
  <path d="M40 170c2-6 4-6 6 0M194 164c2-6 4-6 6 0" stroke="#6fa344" stroke-width="1.6" stroke-linecap="round"/>
</svg>

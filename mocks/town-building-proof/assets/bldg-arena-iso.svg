<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    .flag-l, .flag-r, .spar-a, .spar-b, .arm-a, .arm-b { pointer-events: none; }
    .flag-l, .flag-r { transform-box: fill-box; transform-origin: 0% 30%; }
    .flag-l { animation: wave 2.8s ease-in-out infinite; }
    .flag-r { animation: wave 3.4s ease-in-out infinite; }
    .spar-a, .spar-b { transform-box: fill-box; transform-origin: 50% 100%; }
    .spar-a { animation: lean 3.2s ease-in-out infinite; }
    .spar-b { animation: lean 3.2s ease-in-out infinite reverse; }
    .arm-a, .arm-b { transform-box: fill-box; transform-origin: 0% 50%; }
    .arm-a { animation: arm 3.2s ease-in-out infinite; }
    .arm-b { animation: arm 3.2s ease-in-out infinite reverse; }
    @keyframes wave {
      0%, 100% { transform: skewY(0deg); }
      50% { transform: skewY(8deg) scaleX(0.94); }
    }
    @keyframes lean {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(2px, -1px) rotate(-5deg); }
    }
    @keyframes arm {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-18deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flag-l, .flag-r, .spar-a, .spar-b, .arm-a, .arm-b { animation: none; }
    }
  </style>

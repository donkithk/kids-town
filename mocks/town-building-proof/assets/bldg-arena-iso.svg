<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="none">
  <style>
    svg, svg * { pointer-events: none; }
    .flag-l, .flag-r { transform-box: fill-box; transform-origin: 0% 45%; }
    .flag-l { animation: wave 2.2s ease-in-out infinite; }
    .flag-r { animation: wave 2.6s ease-in-out infinite; transform-origin: 100% 45%; }
    .spar-a, .spar-b { transform-box: fill-box; transform-origin: 50% 92%; }
    .spar-a { animation: hopa 2.4s ease-in-out infinite; }
    .spar-b { animation: hopb 2.4s ease-in-out infinite; }
    .arm-a, .arm-b { transform-box: fill-box; }
    .arm-a { transform-origin: 22% 12%; animation: puncha 2.4s ease-in-out infinite; }
    .arm-b { transform-origin: 78% 12%; animation: punchb 2.4s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: 50% 50%; animation: pop 2.4s ease-in-out infinite; }
    @keyframes wave {
      0%, 100% { transform: rotate(-28deg); }
      50% { transform: rotate(26deg) scaleX(0.78); }
    }
    @keyframes hopa {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      38% { transform: translate(6px, -2px) rotate(-3deg); }
      52% { transform: translate(8px, -1px) rotate(3deg); }
      68% { transform: translate(3px, -1px) rotate(-1deg); }
    }
    @keyframes hopb {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      38% { transform: translate(-6px, -2px) rotate(3deg); }
      52% { transform: translate(-8px, -1px) rotate(-3deg); }
      68% { transform: translate(-3px, -1px) rotate(1deg); }
    }
    @keyframes puncha {
      0%, 100% { transform: rotate(0deg); }
      38% { transform: rotate(-36deg); }
      52% { transform: rotate(-78deg); }
    }
    @keyframes punchb {
      0%, 100% { transform: rotate(0deg); }
      38% { transform: rotate(36deg); }
      52% { transform: rotate(78deg); }
    }
    @keyframes pop {
      0%, 28%, 72%, 100% { opacity: 0; transform: scale(0.3); }
      46%, 58% { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <!-- Cell footprint. Same diamond the shared shadow sits on. -->
  <polygon points="120,190 206,150 120,110 34,150" fill="#e6c48a" stroke="#8b5e3c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M72 166c20-8 32-8 48 0M124 154c16-6 26-5 40 2" stroke="#d7b27a" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- Tall back half. Wide enough to span the diamond, crown raised toward the library roof. -->
  <path d="M36 150L36 100A84 68 0 0 1 204 100L204 150A84 20 0 0 0 36 150Z" fill="#f4e6cc"/>
  <path d="M36 100A84 68 0 0 1 120 32L120 130A84 20 0 0 0 36 150Z" fill="#e4d0b0"/>
  <g fill="#4a3020" stroke="#5c3d28" stroke-width="2" stroke-linejoin="round">
    <path d="M52 82V72a5 5 0 0 1 10 0v10z"/>
    <path d="M72 76V64a6 6 0 0 1 12 0v12z"/>
    <path d="M94 70V56a7 7 0 0 1 14 0v14z"/>
    <path d="M113 66V50a7 7 0 0 1 14 0v16z"/>
    <path d="M134 70V56a7 7 0 0 1 14 0v14z"/>
    <path d="M156 76V64a6 6 0 0 1 12 0v12z"/>
    <path d="M178 82V72a5 5 0 0 1 10 0v10z"/>
  </g>
  <path d="M57 72v8M78 64v10M101 56v12M120 50v14M141 56v12M162 64v10M183 72v8" stroke="#6b4428" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  <path d="M36 100A84 68 0 0 1 204 100" fill="none" stroke="#5c3d28" stroke-width="3"/>
  <path d="M36 150A84 20 0 0 1 204 150" fill="none" stroke="#5c3d28" stroke-width="3"/>
  <path d="M36 100v50M204 100v50" stroke="#5c3d28" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 96A80 62 0 0 1 200 96" fill="none" stroke="#8b5e3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 88A72 52 0 0 1 192 88" fill="none" stroke="#c4a06a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="126" r="4.5" fill="#a67c52" stroke="#5c3d28" stroke-width="2"/>
  <circle cx="204" cy="126" r="4.5" fill="#c4a06a" stroke="#5c3d28" stroke-width="2"/>

  <path d="M64 84V32" stroke="#6b4428" stroke-width="3" stroke-linecap="round"/>
  <g class="flag-l">
    <polygon points="64,38 98,20 92,46 64,52" fill="#d4453a" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M72 36c10-5 18-4 26 1" stroke="#f6e0b0" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M176 84V32" stroke="#6b4428" stroke-width="3" stroke-linecap="round"/>
  <g class="flag-r">
    <polygon points="176,38 142,20 148,46 176,52" fill="#f0c14b" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M168 36c-10-5-18-4-26 1" stroke="#fff6c2" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="48" cy="128" r="5.5" fill="#f0c14b" stroke="#5c3d28" stroke-width="2"/>
  <circle cx="48" cy="128" r="2.1" fill="#fff8e7"/>
  <path d="M44.6 126h6.5" stroke="#c45c26" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Wide sand oval. Kids stand fully inside it. -->
  <ellipse cx="120" cy="156" rx="78" ry="32" fill="#f6e0b0" stroke="#c4a06a" stroke-width="2.5"/>
  <path d="M70 158h28M108 146h22M138 164h26M96 168h18" stroke="#e7c98a" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>

  <g class="spar-a">
    <ellipse cx="94" cy="174" rx="14" ry="4" fill="#5c3d28" opacity=".18"/>
    <path d="M86 172l-1-12M102 172l1-12" stroke="#5c3d28" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="94" cy="150" rx="16" ry="16" fill="#7eb0d4" stroke="#5c3d28" stroke-width="2"/>
    <circle cx="94" cy="126" r="12" fill="#f3c7a3" stroke="#5c3d28" stroke-width="2"/>
    <path d="M87 124q7-7 14 0" stroke="#5c3d28" stroke-width="2" fill="none"/>
    <circle cx="90" cy="124" r="1.4" fill="#5c3d28"/>
    <circle cx="98" cy="124" r="1.4" fill="#5c3d28"/>
    <g class="arm-a">
      <path d="M106 146l2 12" stroke="#f3c7a3" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="108" cy="159" r="4.2" fill="#f3c7a3" stroke="#5c3d28" stroke-width="1.6"/>
    </g>
  </g>
  <g class="spar-b">
    <ellipse cx="146" cy="174" rx="14" ry="4" fill="#5c3d28" opacity=".18"/>
    <path d="M138 172l-1-12M154 172l1-12" stroke="#5c3d28" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="146" cy="150" rx="16" ry="16" fill="#e7a3b0" stroke="#5c3d28" stroke-width="2"/>
    <circle cx="146" cy="126" r="12" fill="#f3c7a3" stroke="#5c3d28" stroke-width="2"/>
    <path d="M139 124q7-7 14 0" stroke="#5c3d28" stroke-width="2" fill="none"/>
    <circle cx="142" cy="124" r="1.4" fill="#5c3d28"/>
    <circle cx="150" cy="124" r="1.4" fill="#5c3d28"/>
    <g class="arm-b">
      <path d="M134 146l-2 12" stroke="#f3c7a3" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="132" cy="159" r="4.2" fill="#f3c7a3" stroke="#5c3d28" stroke-width="1.6"/>
    </g>
  </g>
  <g class="spark" opacity="0">
    <path d="M120 138l2.2 6 6 1.1-4.6 3.6 1.3 6-4.9-3.4-4.9 3.4 1.3-6-4.6-3.6 6-1.1z" fill="#fff6c2" stroke="#e07a3d" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- Low front rim. Top edge stays below the bodies so only feet are covered. -->
  <path d="M44 176A76 12 0 0 0 196 176L184 168A64 6 0 0 1 56 168Z" fill="#f7efe0" stroke="#5c3d28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 170A60 7 0 0 0 180 170" fill="none" stroke="#8b5e3c" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M68 166A52 5 0 0 0 172 166" fill="none" stroke="#c4a06a" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="110,186 130,186 130,172 110,172" fill="#6b4428" stroke="#5c3d28" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M115 176v8M120 176v8M125 176v8" stroke="#8b5e3c" stroke-width="1.2"/>
  <circle cx="120" cy="178" r="1.8" fill="#f0c14b"/>

  <g fill="#e07a3d" stroke="#5c3d28" stroke-width="1">
    <circle cx="40" cy="168" r="2.2"/>
    <circle cx="46" cy="172" r="1.6" fill="#f0c14b"/>
    <circle cx="196" cy="166" r="2"/>
    <circle cx="202" cy="162" r="1.5" fill="#d4453a"/>
  </g>
  <path d="M38 174c2-6 4-6 6 0M194 170c2-6 4-6 6 0" stroke="#6fa344" stroke-width="1.6" stroke-linecap="round"/>
</svg>

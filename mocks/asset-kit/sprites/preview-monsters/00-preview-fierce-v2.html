<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>怪獸 Sprite Preview v2（凶惡少少）— 未批準</title>
  <style>
    body { margin:0; padding:1.5rem; font-family:"Noto Sans TC",system-ui,sans-serif; background:#2a1c12; color:#faf6ef; }
    h1 { font-size:1.25rem; } .note { color:#c4a06a; border-left:4px solid #f0c14b; padding-left:.75rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-top:1.25rem; }
    figure { margin:0; background:#faf6ef; border:3px solid #8b5e3c; border-radius:16px; padding:1rem; text-align:center; }
    img { width:160px; height:160px; object-fit:contain; }
    figcaption { color:#3b2a1a; font-weight:700; margin-top:.75rem; }
    .id { display:block; font-weight:400; color:#7a6550; font-size:.85rem; }
  </style>
</head>
<body>
  <h1>戰鬥怪獸 Preview v2 — 凶惡少少</h1>
  <p class="note">保持暖木／cream／手繪童趣；眼神／姿態硬淨有輕微威脅。未批準前唔入 #20；產品戰鬥維持 emoji fallback。</p>
  <div class="grid">
    <figure><img src="sprite-boar-fierce-v2.png" alt="野豬" /><figcaption>野豬<span class="id">boar · v2</span></figcaption></figure>
    <figure><img src="sprite-wolf-fierce-v2.png" alt="野狼" /><figcaption>野狼<span class="id">wolf · v2</span></figcaption></figure>
    <figure><img src="sprite-bear-fierce-v2.png" alt="白熊" /><figcaption>白熊<span class="id">bear · v2</span></figcaption></figure>
    <figure><img src="sprite-scorpion-fierce-v2.png" alt="巨蠍" /><figcaption>巨蠍<span class="id">scorpion · v2</span></figcaption></figure>
  </div>
</body>
</html>

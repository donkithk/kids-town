<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>怪獸 Sprite Preview — Kids Town（未批準，唔入產品）</title>
  <style>
    body { margin: 0; padding: 1.5rem; font-family: "Noto Sans TC", system-ui, sans-serif; background: #2a1c12; color: #faf6ef; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #c4a06a; max-width: 52rem; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.25rem; }
    figure { margin: 0; background: #faf6ef; border: 3px solid #8b5e3c; border-radius: 16px; padding: 1rem; text-align: center; }
    figure img { width: 160px; height: 160px; object-fit: contain; }
    figcaption { margin-top: 0.75rem; color: #3b2a1a; font-weight: 700; }
    .id { display: block; font-weight: 400; color: #7a6550; font-size: 0.85rem; margin-top: 0.25rem; }
    .note { border-left: 4px solid #f0c14b; padding-left: 0.75rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>戰鬥怪獸 Sprite Preview</h1>
  <p class="note">風格目標：暖木／cream／手繪童趣（同公會／荒野 UI）。<strong>未批準前唔入 #20</strong>；產品戰鬥暫用 icon／emoji fallback。</p>
  <div class="grid">
    <figure><img src="sprite-boar-preview.png" alt="野豬" /><figcaption>野豬<span class="id">id: boar</span></figcaption></figure>
    <figure><img src="sprite-wolf-preview.png" alt="野狼" /><figcaption>野狼<span class="id">id: wolf</span></figcaption></figure>
    <figure><img src="sprite-bear-preview.png" alt="白熊" /><figcaption>白熊<span class="id">id: bear</span></figcaption></figure>
    <figure><img src="sprite-scorpion-preview.png" alt="巨蠍" /><figcaption>巨蠍<span class="id">id: scorpion</span></figcaption></figure>
  </div>
</body>
</html>

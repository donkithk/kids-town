[pytest]
pythonpath = .
testpaths = tests
addopts = -v
markers =
    phase0: Phase 0 security TDD cases (docs/test-cases/PHASE0_SECURITY.md)
    phase1: Phase 1 gameplay TDD cases (docs/test-cases/PHASE1_GAMEPLAY.md)
    phase1_5: Phase 1.5 onboarding pack TDD (docs/test-cases/PHASE1_5_ONBOARD.md)
    frontend: Playwright browser E2E (tests/test_frontend.py)
    case_id: Kids Town test-case identifier
